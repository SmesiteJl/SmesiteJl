<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Nikita Moskalev — Java Backend Developer">
  <title>Nikita Moskalev — Java Backend Developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="55%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#94e2d5"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.35 0; 0.35 0; -0.35 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#89b4fa" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#94e2d5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f5c2e7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#74c7ec" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c2e7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f5c2e7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#313244" fill-opacity="0.55"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="240" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#dots)"/>

    <!-- Slow-drifting aurora, offset in phase so the field never repeats cleanly -->
    <g>
      <ellipse cx="180" cy="60" rx="300" ry="180" fill="url(#glowA)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 90 34; -40 18; 0 0" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="760" cy="200" rx="330" ry="190" fill="url(#glowB)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; -80 -40; 50 -14; 0 0" dur="21s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="520" cy="20" rx="240" ry="140" fill="url(#glowC)">
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 46 40; -60 12; 0 0" dur="26s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Contribution-tower motif on the right, echoing the 3D skyline below -->
    <g transform="translate(636 172)" stroke-linecap="round">
      <g stroke="#89b4fa" stroke-opacity="0.75" stroke-width="7">
        <line x1="0"   y1="0" x2="0"   y2="-28"><animate attributeName="y2" values="-28;-64;-28"  dur="4.0s" repeatCount="indefinite"/></line>
        <line x1="20"  y1="0" x2="20"  y2="-54"><animate attributeName="y2" values="-54;-22;-54"  dur="4.8s" repeatCount="indefinite"/></line>
        <line x1="40"  y1="0" x2="40"  y2="-36"><animate attributeName="y2" values="-36;-82;-36"  dur="5.6s" repeatCount="indefinite"/></line>
        <line x1="60"  y1="0" x2="60"  y2="-70"><animate attributeName="y2" values="-70;-34;-70"  dur="4.4s" repeatCount="indefinite"/></line>
      </g>
      <g stroke="#cba6f7" stroke-opacity="0.85" stroke-width="7">
        <line x1="80"  y1="0" x2="80"  y2="-46"><animate attributeName="y2" values="-46;-96;-46"  dur="6.2s" repeatCount="indefinite"/></line>
        <line x1="100" y1="0" x2="100" y2="-88"><animate attributeName="y2" values="-88;-40;-88"  dur="5.0s" repeatCount="indefinite"/></line>
        <line x1="120" y1="0" x2="120" y2="-58"><animate attributeName="y2" values="-58;-108;-58" dur="6.8s" repeatCount="indefinite"/></line>
      </g>
      <g stroke="#94e2d5" stroke-opacity="0.8" stroke-width="7">
        <line x1="140" y1="0" x2="140" y2="-74"><animate attributeName="y2" values="-74;-30;-74"  dur="5.2s" repeatCount="indefinite"/></line>
        <line x1="160" y1="0" x2="160" y2="-40"><animate attributeName="y2" values="-40;-86;-40"  dur="4.6s" repeatCount="indefinite"/></line>
        <line x1="180" y1="0" x2="180" y2="-62"><animate attributeName="y2" values="-62;-24;-62"  dur="6.0s" repeatCount="indefinite"/></line>
      </g>
      <g stroke="#f5c2e7" stroke-opacity="0.7" stroke-width="7">
        <line x1="200" y1="0" x2="200" y2="-32"><animate attributeName="y2" values="-32;-70;-32"  dur="5.4s" repeatCount="indefinite"/></line>
        <line x1="220" y1="0" x2="220" y2="-52"><animate attributeName="y2" values="-52;-18;-52"  dur="4.2s" repeatCount="indefinite"/></line>
      </g>
      <line x1="-14" y1="8" x2="234" y2="8" stroke="#313244" stroke-width="2"/>
    </g>

    <!-- Identity block -->
    <g transform="translate(64 0)">
      <text x="0" y="86" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
            font-size="15" letter-spacing="4.5" fill="#7f849c">$ whoami</text>

      <text x="0" y="140" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
            font-size="46" font-weight="700" fill="url(#accent)">Nikita Moskalev</text>

      <text x="0" y="176" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
            font-size="18" fill="#a6adc8">Java Backend Developer
        <tspan fill="#585b70"> · </tspan><tspan fill="#94e2d5">Kazan, RU</tspan>
      </text>

      <rect x="378" y="162" width="10" height="19" fill="#cba6f7">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Sweeping rule along the bottom edge -->
    <rect x="0" y="228" width="1000" height="2.5" fill="url(#rule)">
      <animate attributeName="x" values="-1000;1000" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1000" height="240" rx="18" fill="none" stroke="#313244" stroke-width="2"/>
  </g>
</svg>
