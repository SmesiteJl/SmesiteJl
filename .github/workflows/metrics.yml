name: Metrics

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # The point of this card is the numbers the hosted stats services cannot
      # reach: it runs with a PAT of its own, so private repositories count.
      # Public-only tooling reports ~125 commits and 0.9 MB of code; with the
      # private work included it is 355 contributions and 2.8 MB.
      - name: Stats including private repositories
        uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmesiteJl
          base: header
          repositories_affiliations: owner
          config_display: large
          config_timezone: Europe/Moscow
          retries_output_action: 5
          retries_delay_output_action: 30
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_skipped: SmesiteJl/free-sked, SmesiteJl/SmesiteJl
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_colors: "0:#cba6f7, 1:#89b4fa, 2:#94e2d5, 3:#f9e2af, 4:#fab387, 5:#f5c2e7"
          plugin_languages_details: bytes-size, percentage
          extras_css: |
            svg { background: #1e1e2e; color: #cdd6f4; }
            h2 { color: #cba6f7 !important; }
            .field, text, span, tspan { color: #cdd6f4 !important; }
            a { color: #89b4fa !important; }
            /* Diff history is drawn with GitHub's green/red; a CSS fill beats
               the presentation attribute, so the palette wins. */
            [fill="rgb(63, 185, 80)"] { fill: #a6e3a1 !important; }
            [fill="rgb(218, 54, 51)"] { fill: #f38ba8 !important; }
            [fill="#ebedf0"] { fill: #313244 !important; }
            [fill="#9be9a8"] { fill: #45566e !important; }
            [fill="#40c463"] { fill: #74c7ec !important; }
            [fill="#30a14e"] { fill: #89b4fa !important; }
            [fill="#216e39"] { fill: #cba6f7 !important; }
          # The header is only enabled so the base GraphQL query runs; two of its
          # rows say nothing worth saying. Removing the nodes (rather than hiding
          # them) lets metrics measure the real height when it rasterises.
          extras_js: |
            document.querySelectorAll(".field").forEach(f => {
              if (/Followed by|Joined GitHub/.test(f.textContent)) f.remove()
            })
